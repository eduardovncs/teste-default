    default: true
    workspace:
      host: https://dbc-222fe855-b9d6.cloud.databricks.com

  prod:
    mode: production
    workspace:
      host: https://dbc-222fe855-b9d6.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/labuser9910315_1746292654@vocareum.com to make sure we only have a single copy.
      root_path: /Workspace/Users/labuser9910315_1746292654@vocareum.com/.bundle/${bundle.name}/${bundle.target}
    permissions:
      - user_name: labuser9910315_1746292654@vocareum.com
        level: CAN_MANAGE
